networks: 
  cloud-net: 
    name: cloud-net

services:
  # 1. Web Frontend Server (instance 1)
  web-frontend-server1:
    image: tattocxoanptt122005/myminicloud-web:v1.0
    container_name: web-frontend-server1
    restart: always
    networks:
      cloud-net:
        aliases:
          - web-frontend-server
    ports: [ "8080:80" ]
    volumes:
      - ./web-frontend-server/conf.instance1:/etc/nginx/conf.d/default.conf:ro

  # 1. Web Frontend Server (instance 2)
  web-frontend-server2:
    image: tattocxoanptt122005/myminicloud-web:v1.0
    container_name: web-frontend-server2
    restart: always
    networks: [cloud-net]
    ports: [ "8082:80" ]
    volumes:
      - ./web-frontend-server/conf.instance2:/etc/nginx/conf.d/default.conf:ro

  # 2. Application Backend Server
  application-backend-server:
    image: tattocxoanptt122005/myminicloud-app:v1.0
    container_name: application-backend-server
    restart: always
    networks: [cloud-net]
    ports: [ "8085:8081" ]
    environment:
      OIDC_ISSUER: "http://${PUBLIC_IP}:8081/realms/your_realm"
      OIDC_AUDIENCE: "flask-app"
      OIDC_JWKS_URL: "http://authentication-identity-server:8080/realms/your_realm/protocol/openid-connect/certs"

  # 3. Relational Database Server
  relational-database-server:
    image: mariadb:11
    container_name: relational-database-server
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-YOUR_SECRET_PASSWORD}
      MARIADB_DATABASE: minicloud
    volumes:
      - ./relational-database-server/init:/docker-entrypoint-initdb.d:ro
      - mysql_data:/var/lib/mysql
    ports: [ "3306:3306" ]
    networks: [cloud-net]

  # 4. Authentication Identity Server (Keycloak)
  authentication-identity-server:
    image: quay.io/keycloak/keycloak:latest
    container_name: authentication-identity-server
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-YOUR_SECRET_PASSWORD}
      KC_HOSTNAME: "${PUBLIC_IP}"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./authentication-identity-server/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports: [ "8081:8080" ]
    restart: always
    networks: [cloud-net]

  # 5. Object Storage Server (MinIO)
  object-storage-server:
    image: minio/minio
    container_name: object-storage-server
    restart: always
    command: ["server","/data","--console-address",":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_ADMIN_PASSWORD:-YOUR_SECRET_PASSWORD}
    volumes:
      - ./object-storage-server/data:/data
    ports: 
      - "9000:9000"
      - "9001:9001"
    networks: [cloud-net]

  # 5. Bootstrap script for MinIO
  object-storage-bootstrap:
    image: minio/mc:latest
    container_name: object-storage-bootstrap
    depends_on:
      - object-storage-server
    volumes:
      - ./object-storage-server/bootstrap/init-minio.sh:/bootstrap/init-minio.sh:ro
      - ./object-storage-server/seed:/seed:ro
    entrypoint: ["/bin/sh", "/bootstrap/init-minio.sh"]
    networks: [cloud-net]

  # 6. Internal DNS Server (Bind9)
  internal-dns-server:
    image: internetsystemsconsortium/bind9:9.18
    container_name: internal-dns-server
    restart: always
    ports: [ "1053:53/udp" ]
    volumes:
      - ./internal-dns-server/named.conf:/etc/bind/named.conf:ro
      - ./internal-dns-server/named.conf.options:/etc/bind/named.conf.options:ro
      - ./internal-dns-server/named.conf.local:/etc/bind/named.conf.local:ro
      - ./internal-dns-server/db.cloud.local:/etc/bind/db.cloud.local:ro
    networks: [cloud-net]

  # 7. Monitoring Node Exporter Server
  monitoring-node-exporter-server:
    image: prom/node-exporter:latest
    container_name: monitoring-node-exporter-server
    restart: always
    ports: [ "9100:9100" ]
    networks: [cloud-net]

  # 8. Monitoring Prometheus Server
  monitoring-prometheus-server:
    image: prom/prometheus:latest
    container_name: monitoring-prometheus-server
    restart: always
    ports: [ "9090:9090" ]
    volumes:
      - ./monitoring-prometheus-server/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [cloud-net]

  # 9. Monitoring Grafana Dashboard Server (Visualization)
  monitoring-grafana-dashboard-server:
    image: grafana/grafana:latest
    container_name: monitoring-grafana-dashboard-server
    restart: always
    depends_on:
      - monitoring-prometheus-server
    ports: [ "3000:3000" ]
    volumes:
      - ./monitoring-grafana-dashboard-server/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring-grafana-dashboard-server/dashboards:/var/lib/grafana/dashboards:ro
    networks: [cloud-net]

  # 10. API Gateway Proxy Server (Nginx)
  api-gateway-proxy-server:
    image: nginx:stable
    container_name: api-gateway-proxy-server
    restart: always
    depends_on:
      - web-frontend-server1
      - web-frontend-server2
      - application-backend-server
      - authentication-identity-server
    ports: [ "80:80" ]
    volumes:
      - ./api-gateway-proxy-server/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [cloud-net]

volumes:
  mysql_data: